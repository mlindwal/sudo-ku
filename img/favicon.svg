<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Sudo-ku icon: one 3×3 Sudoku box on a blue tile, with digits drawn as paths. -->
  <rect width="64" height="64" rx="14" fill="#2f5bd3"/>
  <g fill="#ffffff">
    <rect x="7"  y="7"  width="14" height="14" rx="3"/>
    <rect x="25" y="7"  width="14" height="14" rx="3"/>
    <rect x="43" y="7"  width="14" height="14" rx="3"/>
    <rect x="7"  y="25" width="14" height="14" rx="3"/>
    <rect x="25" y="25" width="14" height="14" rx="3"/>
    <rect x="43" y="25" width="14" height="14" rx="3"/>
    <rect x="7"  y="43" width="14" height="14" rx="3"/>
    <rect x="25" y="43" width="14" height="14" rx="3"/>
    <rect x="43" y="43" width="14" height="14" rx="3"/>
  </g>
  <g fill="none" stroke="#1d2233" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <!-- 1, top left -->
    <path d="M 12.9 11.2 L 15.1 9.8 V 18.2"/>
    <!-- 5, centre -->
    <path d="M 35 27.3 H 29.5 L 29 31.1 Q 30.7 30.4 32.3 30.6 Q 35.1 31 35.1 33.6 Q 35.1 36.7 31.9 36.7 Q 29.9 36.7 28.9 35.4"/>
    <!-- 9, bottom right -->
    <path d="M 52.8 48.1 Q 52.8 45.3 50 45.3 Q 47.2 45.3 47.2 48.1 Q 47.2 50.8 50 50.8 Q 52.8 50.8 52.8 48.1 V 50.1 Q 52.8 54.7 49.4 54.7 Q 48 54.7 47.3 53.8"/>
  </g>
</svg>
