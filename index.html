<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Play Sudoku in the browser with difficulty levels, a timer, pencil notes and sound effects.">
  <title>Sudo-ku</title>
  <script>
    // Apply the saved theme before the page is drawn, to avoid a flash of the
    // wrong colors. With no saved choice, the theme follows the system.
    try {
      const theme = localStorage.getItem('sudo-ku.theme');
      if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme;
    } catch { /* storage unavailable: follow the system */ }
  </script>
  <link rel="icon" href="img/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="icon" href="img/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="img/apple-touch-icon.png">
  <meta name="theme-color" content="#2f5bd3">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="app">
    <header class="topbar">
      <h1><img class="logo" src="img/favicon.svg" alt="" width="32" height="32">Sudo-ku</h1>
      <div class="topbar-buttons">
        <button id="theme" type="button" aria-label="Theme: follows system">🌓</button>
        <button id="new-game" type="button">New game</button>
      </div>
    </header>

    <div class="status">
      <span id="difficulty-label" class="badge"></span>
      <span id="mistakes" class="mistakes" hidden>Mistakes <span id="mistakes-count">0/5</span></span>
      <div class="clock">
        <span id="timer" aria-label="Elapsed time">0:00</span>
        <button id="pause" type="button" class="icon-button" aria-label="Pause">❚❚</button>
        <button id="mute" type="button" class="icon-button" aria-label="Mute sounds" aria-pressed="false">🔊</button>
      </div>
    </div>

    <div class="board-wrap">
      <div id="board" class="board" role="grid" aria-label="Sudoku board"></div>
      <div id="overlay" class="overlay" hidden>
        <p id="overlay-title" class="overlay-title"></p>
        <p id="overlay-text"></p>
        <div id="overlay-buttons" class="overlay-buttons"></div>
      </div>
    </div>

    <div class="actions">
      <button id="undo" type="button" class="action">
        <span class="action-icon" aria-hidden="true">↶</span>Undo
      </button>
      <button id="erase" type="button" class="action">
        <span class="action-icon" aria-hidden="true">⌫</span>Erase
      </button>
      <button id="notes" type="button" class="action" aria-pressed="false">
        <span class="action-icon" aria-hidden="true">✎</span>Notes: <span id="notes-state">Off</span>
      </button>
    </div>

    <div id="pad" class="pad" aria-label="Number pad"></div>

    <p class="help">
      Keyboard: <kbd>1</kbd>–<kbd>9</kbd> fill in, <kbd>Shift</kbd>+digit adds a note,
      arrows move, <kbd>Backspace</kbd> erases, <kbd>N</kbd> toggles notes, <kbd>P</kbd> pauses, <kbd>M</kbd> mutes, <kbd>T</kbd> changes theme,
      <kbd>Ctrl</kbd>+<kbd>Z</kbd> undoes.
    </p>
  </main>

  <script src="js/sudoku.js"></script>
  <script src="js/sound.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
